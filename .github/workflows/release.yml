name: Vydání modulu
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: jad-kouzla }
      - uses: actions/checkout@v4
        with: { repository: foundryvtt/dnd5e, path: dnd5e }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Vygenerovat kouzla
        working-directory: jad-kouzla
        run: python3 tools/generuj.py --dnd5e ../dnd5e
      - name: Sestavit kompendia a ZIP
        working-directory: jad-kouzla
        run: |
          npm install
          mkdir -p dist
          npm run zip
          cp module.json dist/module.json
      - name: Nahrát k vydání
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jad-kouzla/dist/module.json
            jad-kouzla/dist/jad-kouzla.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jad-kouzla
          path: jad-kouzla/dist/
