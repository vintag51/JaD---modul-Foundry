name: Vydání modulu
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existujícího vydání, ke kterému nahrát (např. v0.7.5) – prázdné = jen sestavit"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: { path: jeskyne-a-draci }
      - uses: actions/checkout@v4
        with: { repository: foundryvtt/dnd5e, path: dnd5e }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - name: Vygenerovat obsah
        working-directory: jeskyne-a-draci
        run: |
          python3 tools/generuj.py --dnd5e ../dnd5e
          python3 tools/generuj_predmety.py --dnd5e ../dnd5e
          python3 tools/generuj_rasy.py
          python3 tools/generuj_povolani.py
          python3 tools/generuj_zazemi.py
          python3 tools/kontrola.py
      - name: Verze podle tagu vydání
        if: env.TAG != ''
        working-directory: jeskyne-a-draci
        run: |
          python3 - <<'PY'
          import json, os
          tag = os.environ["TAG"]
          m = json.load(open("module.json", encoding="utf-8"))
          m["version"] = tag.lstrip("v")
          m["download"] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/jeskyne-a-draci.zip"
          json.dump(m, open("module.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print("Verze modulu:", m["version"])
          PY
      - name: Sestavit kompendia a ZIP
        working-directory: jeskyne-a-draci
        run: |
          set -o pipefail
          mkdir -p dist
          ( npm install && node tools/kontrola-sablon.mjs && npm run zip ) 2>&1 | tee build.log || {
            tail -n 25 build.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          cp module.json dist/module.json
      - name: Nahrát k vydání
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          overwrite_files: true
          files: |
            jeskyne-a-draci/dist/module.json
            jeskyne-a-draci/dist/jeskyne-a-draci.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jeskyne-a-draci
          path: jeskyne-a-draci/dist/
