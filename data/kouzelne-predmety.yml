  - {srd: equipment/cloak-of-protection, n: Ochranný plášť, kotva: ochranny-plast, d: "+1 k OČ a k Záchranám."}
  - {n: Opasek Obří síly, kotva: opasek-obri-sily, d: "Tvá Síla se změní na Sílu daného obra (Kopcový 21, Kamenný a Ledový 23, Ohnivý 25, Oblačný 27, Bouřný 29), pokud nebyla vyšší.",
     varianty: [{srd: equipment/belt-of-hill-giant-strength, n: "Opasek Obří síly (Kopcový obr)"}, {srd: equipment/belt-of-stone-giant-strength, n: "Opasek Obří síly (Kamenný obr)"},
                {srd: equipment/belt-of-frost-giant-strength, n: "Opasek Obří síly (Ledový obr)"}, {srd: equipment/belt-of-fire-giant-strength, n: "Opasek Obří síly (Ohnivý obr)"},
                {srd: equipment/belt-of-cloud-giant-strength, n: "Opasek Obří síly (Oblačný obr)"}, {srd: equipment/belt-of-storm-giant-strength, n: "Opasek Obří síly (Bouřný obr)"}]}

Předměty pro vyvolávání:
  - {srd: trinket/pipes-of-the-sewers, n: Flétna stok, kotva: fletna-stok,
     d: "Vyžaduje Zdatnost s dechovými nástroji. Krysy na tebe neútočí. Tři Dávky (obnova 1k3 za úsvitu): hraním a Dávkami přivoláš z okolí půl míle Hejna krys; Střetem Charismatu s jejich Moudrostí je přiměješ poslouchat, dokud hraješ."}
  - {srd: ring/ring-of-djinni-summoning, n: Prsten přivolávání Džinů, kotva: prsten-privolavani-dzinu,
     d: "Přivolá spřízněného Džina do 24 sáhů. Zůstane, dokud se Soustředíš (nejvýš hodinu) nebo nepadne, a plní tvé příkazy."}
  - {n: Roh Valhally, kotva: roh-valhally,
     d: "Akcí přivoláš duše padlých válečníků (Berserkry) na hodinu nebo do jejich pádu; znovu po sedmi dnech. Kdo nesplní požadavek rohu, má je proti sobě. Stříbrný 2k4 + 2 (bez požadavku), Mosazný 3k4 + 3 (Jednoduché zbraně), Bronzový 4k4 + 4 (Střední zbroje), Železný 5k4 + 5 (Válečné zbraně).",
     varianty: [{srd: trinket/silver-horn-of-valhalla, n: "Roh Valhally (stříbrný)"}, {srd: trinket/brass-horn-of-valhalla, n: "Roh Valhally (mosazný)"},
                {srd: trinket/bronze-horn-of-valhalla, n: "Roh Valhally (bronzový)"}, {srd: trinket/iron-horn-of-valhalla, n: "Roh Valhally (železný)"}]}

Předměty obnovující Výdrž:
  - {srd: ring/ring-of-regeneration, n: Prsten regenerace, kotva: prsten-regenerace,
     d: "Máš-li aspoň 1 Bod výdrže, každých deset minut si obnovíš 1k6. Ztracená část těla doroste za 1k6 + 1 dní."}
  - {srd: potion/restorative-ointment, n: Regenerační mazání, kotva: regeneracni-mazani,
     d: "Pět Dávek. Natřený tvor si obnoví 2k8 + 2 Bodů výdrže a zbaví se Nemocí a Stavu Otrávený."}

Předměty způsobující Stavy:
  - {srd: wand/wand-of-paralysis, n: Hůlka paralýzy, kotva: hulka-paralyzy,
     d: "Sedm Dávek (obnova 1k6 + 1 denně). Paprsek na tvora do 12 sáhů: Záchrana na Odolnost SO 15, jinak minutu Paralyzován (opakuje na konci Tahů). Po poslední Dávce na 1 na k20 zanikne."}
  - {srd: trinket/rope-of-entanglement, n: Omotávací lano, kotva: omotavaci-lano,
     d: "Akcí ho pošleš na tvora do 4 sáhů: Záchrana na Obratnost SO 15, jinak Zadržen. Uvolníš ho Bonusovou akcí, on se může vyprostit Ověřením Síly či Obratnosti. Lano má OČ 20 a 20 Bodů výdrže a regeneruje."}
  - {srd: rod/rod-of-rulership, n: Žezlo panování, kotva: zezlo-panovani,
     d: "Jednou denně přikážeš tvorovi do 24 sáhů: Záchrana na Moudrost SO 15, jinak je osm hodin Zmámen a řídí se tebou. Zranění nebo příkaz proti jeho povaze účinek ukončí."}

Předměty s různými efekty:
  - {srd: equipment/robe-of-stars, n: Roucho hvězd, kotva: roucho-hvezd,
     d: "+1 k Záchranám. Akcí přecházíš do Astrální sféry a zpět. Akcí strhneš jednu ze šesti hvězd a sešleš Magickou střelu 5. Stupně; obnoví se 1k6 hvězd denně."}
  - {srd: equipment/robe-of-eyes, n: Roucho očí, kotva: roucho-oci,
     d: "Vidíš všemi směry a máš Výhodu ke zrakovému Vnímání. Světlo či Denní světlo do 1 sáhu tě na minutu oslepí (Záchrana na Odolnost SO 11, resp. 15 na konci Tahů)."}
  - {srd: trinket/scarab-of-protection, n: Skarabeus ochrany, kotva: skarabeus-ochrany,
     d: "Výhoda k Záchranám proti kouzlům a magii. Neuspěješ-li proti Nekromantickému kouzlu či zraňujícímu účinku Nemrtvého, změníš Reakcí neúspěch v úspěch za jednu z 12 Dávek."}

Předměty, které dávají trvalý přínos:
  - {srd: equipment/goggles-of-night, n: Brýle noci, kotva: bryle-noci, d: "Vidění ve tmě na 12 sáhů; máš-li ho už, prodlouží se o 12 sáhů."}
  - {srd: trinket/lantern-of-revealing, n: Lucerna odhalení, kotva: lucerna-odhaleni, d: "Lucerna s okenicemi, v jejímž světle jsou vidět Neviditelní tvorové (ne ti v Éterické sféře)."}
  - {srd: equipment/necklace-of-adaptation, n: Náhrdelník přizpůsobení, kotva: nahrdelnik-prizpusobeni, d: "Dýcháš v jakémkoli prostředí a máš Výhodu k Záchranám proti plynům a výparům."}
  - {srd: equipment/mantle-of-spell-resistance, n: Pelerína magického odolání, kotva: pelerina-magickeho-odolani, d: "Výhoda k Záchranám proti kouzlům a magickým účinkům."}
  - {n: Prsten odolání, kotva: prsten-odolani, d: "Odolnost proti jednomu Typu zásahu.", odolnost: "ring/ring-of-{typ}-resistance"}
  - {srd: ring/ring-of-spell-turning, n: Prsten odrážení kouzel, kotva: prsten-odrazeni-kouzel,
     d: "Výhoda k Záchranám proti kouzlům mířeným jen na tebe. Padne-li 20 a kouzlo je do 7. Stupně, odrazí se na sesilatele."}
  - {srd: ring/ring-of-mind-shielding, n: Prsten zaštítění mysli, kotva: prsten-zastiteni-mysli,
     d: "Magie nečte tvé myšlenky ani nepozná lži, Přesvědčení či typ; telepatie jen s tvým svolením. Akcí prsten zneviditelníš. Kdo s ním zemře, jeho duše v něm zůstane."}
  - {srd: equipment/periapt-of-proof-against-poison, n: Škapulíř proti Jedu, kotva: skapulir-proti-jedu, d: "Imunita vůči Jedovému zásahu a Stavu Otrávený."}

Cestovatelské vybavení:
  - {n: Létající koberec, kotva: letajici-koberec,
     d: "Akcí a zaklínadlem ho rozletíš (musíš být do 6 sáhů). Unese dvojnásobek nosnosti, nad základní nosností letí poloviční rychlostí. 0,5 × 1 sáh: 20 Řádků, 16 sáhů; 1 × 1: 40 Řádků, 12 sáhů; 1 × 1,5: 60 Řádků, 8 sáhů; 1 × 2: 80 Řádků, 6 sáhů.",
     varianty: [{srd: trinket/carpet-of-flying-3x5, n: "Létající koberec (0,5 × 1 sáh)"}, {srd: trinket/carpet-of-flying-4x6, n: "Létající koberec (1 × 1 sáh)"},
                {srd: trinket/carpet-of-flying-5x7, n: "Létající koberec (1 × 1,5 sáhu)"}, {srd: trinket/carpet-of-flying-6x9, n: "Létající koberec (1 × 2 sáhy)"}]}
  - {srd: trinket/broom-of-flying, n: Létající koště, kotva: letajici-koste,
     d: "Na zaklínadlo (Akce) létá rychlostí 12 sáhů s nosností 20 Řádků (dvojnásobek poloviční rychlostí). Můžeš ho poslat až míli daleko a přivolat zpět."}
  - {srd: container/bag-of-holding, n: Pytel beztíže, kotva: pytel-beztize,
     d: "Zabírá jen Řádek, ale pojme 50 Řádků. Roztržený vysype obsah do Astrální sféry; vzduch pro tvora vydrží 10 minut. Se Šikovnou brašnou se navzájem zničí a vše okolo odnese do Astrální sféry."}
  - {srd: equipment/cloak-of-the-manta-ray, n: Rejnočí plášť, kotva: rejnoci-plast, d: "S nasazenou kápí dýcháš pod vodou a plaveš rychlostí 12 sáhů."}
  - {srd: trinket/folding-boat, n: Skládací člun, kotva: skladaci-clun, d: "Krabička, kterou Akcí rozložíš na člun pro čtyři nebo loď pro patnáct Středních tvorů, a zase zpět."}
  - {srd: container/handy-haversack, n: Šikovná brašna, kotva: sikovna-brasna,
     d: "Dvě boční kapsy po 2 Řádcích a hlavní na 8 Řádků, a přesto se počítá jako Drobný předmět. Hledaná věc je vždy navrchu. Nesnese se s Pytlem beztíže."}
  - {srd: container/efficient-quiver, n: Šikovný toulec, kotva: sikovny-toulec, d: "Pojme 60 šípů, 18 oštěpů a 6 luků či kopí, přesto je to Drobný předmět."}
  - {srd: trinket/rope-of-climbing, n: Šplhací lano, kotva: splhaci-lano,
     d: "12 sáhů dlouhé lano, které Akcí oživíš a Bonusovými akcemi mu přikazuješ: lézt k cíli (2 sáhy za Kolo), smotat se, uvázat či odvázat se a vytvořit uzly. OČ 20, 20 Bodů výdrže, regeneruje."}
  - {srd: equipment/slippers-of-spider-climbing, n: Trepky pavoučího šplhu, kotva: trepky-pavouciho-splhu,
     d: "Rychlost šplhání rovná tvé Rychlosti, i po stěnách a stropech – ne však po kluzkém povrchu."}

Předměty s konkrétním účelem:
  - {srd: equipment/cloak-of-elvenkind, n: Elfí plášť, kotva: elfi-plast, d: "S nasazenou kápí máš Výhodu k Nenápadnosti a ostatní mají Nevýhodu k Vnímání, když tě hledají."}
  - {srd: wand/wand-of-enemy-detection, n: Hůlka nalezení nepřátel, kotva: hulka-nalezeni-nepratel,
     d: "Sedm Dávek (obnova 1k6 + 1 denně). Dávkou na minutu zjistíš směr k nejbližšímu nepřátelskému tvorovi do 12 sáhů, i neviditelnému či skrytému."}
  - {srd: wand/wand-of-secrets, n: Hůlka tajemství, kotva: hulka-tajemstvi, d: "Tři Dávky (obnova 1k3 denně). Dávkou ukáže na nejbližší tajné dveře nebo past."}
  - {k: lakmusove-papirky, zaklad: potion/antitoxin, n: Lakmusové papírky, kotva: lakmusove-papirky, jad: true, vz: common, typ: trinket, mnozstvi: 10,
     d: "Papírek ponořený do tekutiny prozradí nemagický jed – jaký je a jak silný. Balení obsahuje deset papírků."}
  - {k: truhla-elegance, zaklad: container/chest, n: Truhla elegance, kotva: truhla-elegance, jad: true, vz: common,
     d: "Oděvy a zbroje z truhly vyjdeš čisté, urovnané (oděvy i vyžehlené) a jemně vonící levandulí."}
  - {srd: trinket/chime-of-opening, n: Zvonička otevírání, kotva: zvonicka-otevirani,
     d: "Akcí ji namíříš na předmět do 24 sáhů – zazvoní a otevře se jeden zámek či petlice. Po desátém použití praskne."}
  - {srd: rod/rod-of-security, n: Žezlo bezpečnosti, kotva: zezlo-bezpecnosti,
     d: "Akcí přeneseš sebe a až 199 tvorů do mimosférického ráje, kde nestárnou a hojí se. Pobyt (200 dní dělených mezi všechny) ukončíš Akcí. Znovu za deset dní."}

Předměty s nepředvídatelným užitím:
  - {srd: trinket/decanter-of-endless-water, n: Bezedná karafa, kotva: bezedna-karafa,
     d: "Akcí a zaklínadlem z ní vyteče 4 l, 20 l nebo 120 l vody gejzírem. Gejzír lze Bonusovou akcí namířit: předmět do 100 kg odhodí, tvor musí uspět v Záchraně na Sílu SO 13, jinak utrpí 1k4 Drtivého zásahu a je Sražen."}
  - {k: duhova-spona, zaklad: trinket/feather-token-fan, n: Duhová spona, kotva: duhova-spona, jad: true, vz: common, typ: loot,
     d: "Vyřezávaná spona jedné z duhových barev; Bonusovou akcí ji změníš. Vlasy (i vousy, obočí či srst) nositele mají její barvu."}
  - {srd: trinket/eversmoking-bottle, n: Dýmající láhev, kotva: dymajici-lahev,
     d: "Otevřená láhev chrlí hustý dým: zahalí 12 sáhů a šíří se o 2 sáhy za Kolo až na 24. Oblast je Hustě zahalená. Po uzavření dým do deseti minut zmizí."}
  - {srd: trinket/marvelous-pigments, n: Úchvatné barvy, kotva: uchvatne-barvy,
     d: "Kalíšky barev: za deset minut namaluješ předmět či terén (až 40 čtverečních sáhů plochy), který se stane skutečným – v hodnotě nejvýš 25 zl."}
  - {srd: trinket/dust-of-dryness, n: Vysušující prach, kotva: vysusujici-prach,
     d: "Dávka promění krychli vody o hraně 3 sáhy v kuličku, kterou lze Akcí rozbít zpět ve vodu. Vodní Elementál posypaný prachem musí uspět v Záchraně na Odolnost SO 13, jinak 10k6 Nekrotického zásahu (polovina při úspěchu)."}

Artefakty:
  - {k: excalibur, zaklad: weapon/longsword, n: Excalibur, kotva: excalibur, jad: true, vz: artifact, sladeni: required, magie: 3, kostka: [1, 10], kostka2: [1, 12], extra: [1, 10, radiant], kriticky: 19,
     d: "Legendární meč krále, který prosekává kov: +3 k Útoku a Zásahu, k sečnému zásahu přidává stejnou kostku Zářivého, kriticky zasahuje na 19–20 a kritický zásah ničí nemagickou zbraň či štít nebo poškodí zbroj. Při tasení oslepí nepřátele okolo (Odolnost SO 15). Pochva chrání před nemagickými Bodnými, Drtivými a Sečnými zásahy. Zneužitý k sobeckým cílům se může zlomit."}
  - {k: jeden-prsten, zaklad: ring/ring-of-invisibility, n: Jeden prsten, kotva: jeden-prsten, jad: true, vz: artifact, sladeni: required,
     d: "Prsten moci Temného pána. Sladí se jen s tvorem se Zdatnostním bonusem aspoň +4 a dává mu schopnosti dalších Úrovní, vládu nad nositeli menších prstenů, děsivou přítomnost a neviditelnost. Vyvolává ale Závislost a svou vůlí nositele kazí a zrazuje."}
  - {k: kniha-mrtvych, zaklad: loot/book, n: Kniha mrtvých, kotva: kniha-mrtvych, jad: true, vz: artifact, sladeni: required, typ: equipment,
     d: "Černý grimoár smrti. Otevřený rozhostí kolem noc, čte se i bez zraku a umožňuje sesílat nekromantická kouzla – od zvedání Nemrtvých z Pozice 9. Stupně po kouzla navracející život – a Přesun sférami do záhrobí. Zničit nejde, vždy se vrátí."}
  - {k: mjolnir, zaklad: weapon/warhammer, n: Mjölnir, kotva: mjolnir, jad: true, vz: artifact, sladeni: required, kostka: [2, 8], dostrel: [120, 120], vl_plus: [thr, ret], sila: 27,
     d: "Kladivo boha hromu: Zásah 2k8 Drtivý nebo Hromový ignorující Odolnost, při 20 nepřítele Srazí. Sladění zvýší Sílu na 27. Vržený letí až 24 sáhů a vrací se. Obrům způsobuje o 1k8 víc a při 20 je zabíjí. Jednou mezi Odpočinky sešle Svolej blesky."}
